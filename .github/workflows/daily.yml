name: CI and Deploy

# main/master へ push するたびに実行されます。
# 実際の公開は Streamlit Community Cloud がこのリポジトリの更新を検知して自動で再デプロイします。
# このワークフローは「壊れたコードをデプロイしない」ための検証（構文・依存関係）を行います。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app.py

      - name: Import check
        run: |
          python - <<'EOF'
          import streamlit, pandas, numpy, sklearn, lightgbm, plotly, yfinance, requests
          print("streamlit", streamlit.__version__)
          print("lightgbm", lightgbm.__version__)
          EOF

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Notify deploy
        run: |
          echo "検証OK。Streamlit Community Cloud が push を検知して自動デプロイします。"
          echo "コミット: ${GITHUB_SHA}"
